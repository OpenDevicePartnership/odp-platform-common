# Cargo manifest for the patina_boot crate.
#
# SPDX-License-Identifier: MIT
#

[package]
name = "patina_boot"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/OpenDevicePartnership/odp-platform-common"
homepage = "https://github.com/OpenDevicePartnership/odp-platform-common"
description = "Boot orchestration components for Patina firmware."
keywords = ["uefi", "edk2", "patina", "boot", "firmware"]
categories = ["embedded", "no-std"]
readme = "README.md"

[dependencies]
log = { version = "0.4", default-features = false }
patina = { version = "23", features = ["unstable-device-path"] }
patina_macro = { version = "23" }
r-efi = { version = "7", default-features = false }
spin = { version = "0.9", default-features = false, features = ["spin_mutex", "once"] }
zerocopy = { version = "0.8", default-features = false }
zerocopy-derive = { version = "0.8" }

[dev-dependencies]
patina = { version = "23", features = ["mockall", "unstable-device-path"] }
mockall = { version = "0.14" }
criterion = "0.5"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[features]
default = []
doc = []
std = []

[[bench]]
name = "orchestrator"
harness = false

[[bench]]
name = "connect_all"
harness = false

[[bench]]
name = "expand_device_path"
harness = false
