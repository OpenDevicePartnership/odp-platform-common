# Pinned Rust toolchain for patina_boot (UEFI targets).
#
# This tracks the stable channel used by the Patina DXE cores that consume this
# crate. The unstable features the Patina SDK requires are unlocked on stable by
# the RUSTC_BOOTSTRAP/allow-features settings in .cargo/config.toml.
#
# SPDX-License-Identifier: MIT
#

[toolchain]
channel = "1.95.0"
targets = ["x86_64-unknown-uefi", "aarch64-unknown-uefi"]
components = ["rust-src", "clippy", "rustfmt"]
