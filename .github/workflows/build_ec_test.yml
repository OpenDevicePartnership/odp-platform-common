# Builds the EC test applications (ec-test-cli, ec-test-tui) for Windows on
# ARM64 and x86_64.
#
# On pushes to the upstream main branch (and upstream manual dispatch), the
# build is zipped and published as an asset on the rolling "latest" prerelease
# GitHub Release (created once, by hand). Downstream users always have one
# current source of apps to run. Pull requests build only, to validate the
# change without touching the release. Fork pushes are skipped because syncing
# a stale fork can span EC changes and forks do not own the upstream release.
#
# SPDX-License-Identifier: MIT
#
name: Build EC Test

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "ec/**"
      - ".github/workflows/build_ec_test.yml"
  pull_request:
    branches: [main]
    paths:
      - "ec/**"
      - ".github/workflows/build_ec_test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apps:
    if: github.event_name != 'push' || github.event.repository.fork == false
    name: Build Apps (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-pc-windows-msvc
            arch: ARM64
          - target: x86_64-pc-windows-msvc
            arch: x86_64
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust (stable) with ${{ matrix.arch }} target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rustc locates the target MSVC linker/libs (installed on the runner) via
      # the target triple. ARM64 is cross-compiled from the x64 host. The
      # crt-static rustflags live in ec/.cargo/config.toml.
      - name: Build test apps
        working-directory: ec
        run: cargo build --release --locked --target ${{ matrix.target }} -p ec-test-cli -p ec-test-tui

      # Release assets are raw files (gh release upload does not zip), so bundle
      # both executables into one zip per architecture under a fixed `ectest/`
      # folder, so a consumer can extract it onto the image at a predictable path
      # (e.g. C:\ectest\). --clobber replaces the asset from a prior run without
      # disturbing the release metadata or other jobs' assets.
      - name: Package and upload apps
        if: |
          github.event.repository.fork == false &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outDir = 'ec/target/${{ matrix.target }}/release'
          $stageDir = Join-Path $env:RUNNER_TEMP 'ectest'
          if (Test-Path $stageDir) { Remove-Item -Path $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          foreach ($exe in 'ec-test-cli.exe', 'ec-test-tui.exe') {
            $src = Join-Path $outDir $exe
            if (-not (Test-Path -LiteralPath $src)) {
              throw "Expected build output not found: $src"
            }
            Copy-Item -LiteralPath $src -Destination $stageDir
          }
          $zip = Join-Path $env:RUNNER_TEMP 'ec-test-apps-${{ matrix.arch }}.zip'
          if (Test-Path $zip) { Remove-Item -Path $zip -Force }
          Compress-Archive -Path $stageDir -DestinationPath $zip -Force
          gh release upload latest $zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload $zip to the latest release."
          }
