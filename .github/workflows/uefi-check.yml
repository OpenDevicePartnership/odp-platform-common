# CI checks for Rust crates under uefi/crates/.
#
# The patina SDK gates parts of its API on unstable rustc features such as
# `allocator_api`. Crates that unlock those on a pinned stable channel (via the
# RUSTC_BOOTSTRAP/allow-features settings in their .cargo/config.toml, matching
# upstream Patina) build on stable here. Crates that still require a genuine
# nightly compiler pin one below.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'uefi/crates/**'
      - '.github/workflows/uefi-check.yml'
  pull_request:
    paths:
      - 'uefi/crates/**'
      - '.github/workflows/uefi-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: uefi-check

jobs:
  patina-tianocore:
    runs-on: ubuntu-latest
    name: ${{ matrix.task }} / patina_tianocore
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, clippy, test, doc, build-uefi]
    defaults:
      run:
        working-directory: uefi/crates/patina_tianocore
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel + components + targets, but
      # `rustup show` doesn't reliably install missing pieces in CI. Install
      # them explicitly. Update the channel here whenever rust-toolchain.toml
      # is bumped.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-12
          components: rust-src,clippy,rustfmt
          targets: x86_64-unknown-uefi,aarch64-unknown-uefi

      - name: cargo fmt --check
        if: matrix.task == 'fmt'
        run: cargo fmt --check

      - name: cargo clippy (host + UEFI)
        if: matrix.task == 'clippy'
        run: |
          cargo clippy --all-features -- -D warnings
          cargo clippy --all-features --target x86_64-unknown-uefi -- -D warnings
          cargo clippy --all-features --target aarch64-unknown-uefi -- -D warnings

      # Host target only. The UEFI targets have no test harness, so the unit
      # tests are written to run on the host.
      - name: cargo test
        if: matrix.task == 'test'
        run: cargo test --all-features

      - name: cargo doc
        if: matrix.task == 'doc'
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo build (UEFI targets)
        if: matrix.task == 'build-uefi'
        run: |
          cargo build --target x86_64-unknown-uefi
          cargo build --target aarch64-unknown-uefi

  patina-boot:
    runs-on: ubuntu-latest
    name: ${{ matrix.task }} / patina_boot
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, clippy, test, doc, build-uefi]
    defaults:
      run:
        working-directory: uefi/crates/patina_boot
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel + components + targets, but
      # `rustup show` doesn't reliably install missing pieces in CI. Install
      # them explicitly. Update the channel here whenever rust-toolchain.toml
      # is bumped.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rust-src,clippy,rustfmt
          targets: x86_64-unknown-uefi,aarch64-unknown-uefi

      - name: cargo fmt --check
        if: matrix.task == 'fmt'
        run: cargo fmt --check

      - name: cargo clippy (host + UEFI)
        if: matrix.task == 'clippy'
        run: |
          cargo clippy --all-features -- -D warnings
          cargo clippy --all-features --target x86_64-unknown-uefi -- -D warnings
          cargo clippy --all-features --target aarch64-unknown-uefi -- -D warnings

      # Host target only. The UEFI targets have no test harness, so the unit
      # tests are written to run on the host.
      - name: cargo test
        if: matrix.task == 'test'
        run: cargo test --all-features

      - name: cargo doc
        if: matrix.task == 'doc'
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo build (UEFI targets)
        if: matrix.task == 'build-uefi'
        run: |
          cargo build --target x86_64-unknown-uefi
          cargo build --target aarch64-unknown-uefi
